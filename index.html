<!DOCTYPE html>
<html>
<head>
  <title>Happy Birthday 🎂</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      text-align: center;
      background: linear-gradient(to right, #ff9a9e, #fad0c4);
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
    }

    h1 {
      color: white;
      font-size: 40px;
      margin-top: 30px;
    }

    img {
      width: 250px;
      border-radius: 20px;
      margin-top: 20px;
    }

    button {
      margin-top: 30px;
      padding: 15px 30px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      background-color: #ff4081;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background-color: #e91e63;
    }
  </style>
</head>

<body>

  <h1>🎉 Happy Birthday 🎉</h1>

  <!-- Image -->
  <img src="photo.png" alt="Birthday Photo">

  <br>

  <!-- Music Button -->
  <button onclick="playMusic()">Play Music 🎵</button>

  <!-- Audio File -->
  <audio id="bgMusic">
    <source src="music.mp3" type="audio/mpeg">
  </audio>

  <script>
    function playMusic() {
      var music = document.getElementById("bgMusic");
      music.play();
    }
  </script>

</body>
</html>
